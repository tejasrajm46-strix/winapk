<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="arch-title arch-desc" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="arch-title">WINAPK architecture: a Tauri desktop shell over a Rust core over the Android Emulator</title>
  <desc id="arch-desc">Three layers. The desktop layer holds the main window plus four overlay windows drawn over an app window. The Rust core owns the runtime, input, overlay, capture and agent services. Below it, one Android emulator runs with one virtual display per app. The shell talks to the core through one runtime and one adb server; the core drives Android with adb shell input on one display id.</desc>

  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.55" stop-color="#070c14"/>
      <stop offset="1" stop-color="#0a1320"/>
    </linearGradient>
    <linearGradient id="atop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62d0e8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#62d0e8" stop-opacity="0"/>
    </linearGradient>
    <marker id="aarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#62d0e8"/>
    </marker>
    <style>
      .layer   { fill: #0b1626; stroke: #243550; }
      .chip    { fill: #0f1c2f; stroke: #2a3b56; }
      .focus   { fill: #14243a; stroke: #62d0e8; }
      .kicker  { fill: #62d0e8; font-size: 12px; letter-spacing: 2.6px; font-weight: 600; }
      .name    { fill: #e6edf7; font-size: 15px; font-weight: 600; }
      .sub     { fill: #8fa3bd; font-size: 11.5px; }
      .edge    { stroke: #62d0e8; stroke-width: 1.6; fill: none; }
      .edgelbl { fill: #7fb6c9; font-size: 11.5px; letter-spacing: 0.4px; }
      .tag     { fill: #e0231c; font-size: 11px; letter-spacing: 1.6px; font-weight: 700; }
      .body    { fill: #aebfd4; font-size: 12.5px; }
    </style>
  </defs>

  <rect width="1600" height="880" fill="url(#abg)"/>
  <rect width="1600" height="220" fill="url(#atop)"/>

  <!-- ══════════════════════ layer 1 · desktop ══════════════════════ -->
  <rect x="80" y="56" width="1440" height="212" rx="18" class="layer"/>
  <text x="116" y="94" class="kicker">01 · DESKTOP SHELL</text>
  <text x="116" y="120" class="body">Tauri 2 · React 19 · TypeScript — renders what the backend pushes, never mirrors state</text>

  <g>
    <rect x="116" y="140" width="256" height="96" rx="12" class="focus"/>
    <text x="136" y="170" class="name">main window</text>
    <text x="136" y="192" class="sub">library · installer · settings</text>
    <text x="136" y="212" class="sub">the only window with a frame</text>

    <rect x="388" y="140" width="256" height="96" rx="12" class="chip"/>
    <text x="408" y="170" class="name">overlay-labels</text>
    <text x="408" y="192" class="sub">key labels over the app</text>
    <text x="408" y="212" class="sub">click-through</text>

    <rect x="660" y="140" width="256" height="96" rx="12" class="chip"/>
    <text x="680" y="170" class="name">overlay-nav</text>
    <text x="680" y="192" class="sub">Back · Home · Recents</text>
    <text x="680" y="212" class="sub">anchored to the window</text>

    <rect x="932" y="140" width="256" height="96" rx="12" class="chip"/>
    <text x="952" y="170" class="name">overlay-rail</text>
    <text x="952" y="192" class="sub">Screenshot · Rotate · More</text>
    <text x="952" y="212" class="sub">compact vertical toolbar</text>

    <rect x="1204" y="140" width="280" height="96" rx="12" class="chip"/>
    <text x="1224" y="170" class="name">overlay-mapper</text>
    <text x="1224" y="192" class="sub">click-to-place key mapping</text>
    <text x="1224" y="212" class="sub">captures the key you press</text>
  </g>

  <!-- connector 1 -->
  <line x1="800" y1="268" x2="800" y2="316" class="edge" marker-end="url(#aarrow)"/>
  <text x="820" y="298" class="edgelbl">invoke commands · events · one runtime, one adb server</text>

  <!-- ══════════════════════ layer 2 · rust core ══════════════════════ -->
  <rect x="80" y="320" width="1440" height="216" rx="18" class="layer"/>
  <text x="116" y="358" class="kicker">02 · RUST CORE</text>
  <text x="116" y="384" class="body">One owner per concern. No process is started twice, and every child is tracked and cleaned up.</text>

  <g>
    <rect x="116" y="404" width="256" height="100" rx="12" class="chip"/>
    <text x="136" y="434" class="name">runtime</text>
    <text x="136" y="456" class="sub">emulator + adb + scrcpy</text>
    <text x="136" y="476" class="sub">lifecycle and ownership</text>

    <rect x="388" y="404" width="256" height="100" rx="12" class="chip"/>
    <text x="408" y="434" class="name">input</text>
    <text x="408" y="456" class="sub">keyboard hook, profiles</text>
    <text x="408" y="476" class="sub">universal chords first</text>

    <rect x="660" y="404" width="256" height="100" rx="12" class="chip"/>
    <text x="680" y="434" class="name">overlay</text>
    <text x="680" y="456" class="sub">anchoring, visibility</text>
    <text x="680" y="476" class="sub">follows move and resize</text>

    <rect x="932" y="404" width="256" height="100" rx="12" class="chip"/>
    <text x="952" y="434" class="name">capture</text>
    <text x="952" y="456" class="sub">screenshots, recordings</text>
    <text x="952" y="476" class="sub">writes real PNG / MP4 files</text>

    <rect x="1204" y="404" width="280" height="100" rx="12" class="chip"/>
    <text x="1224" y="434" class="name">agent</text>
    <text x="1224" y="456" class="sub">MCP server · CLI client</text>
    <text x="1224" y="476" class="sub">loopback + session token</text>
  </g>

  <!-- connector 2 -->
  <line x1="800" y1="536" x2="800" y2="584" class="edge" marker-end="url(#aarrow)"/>
  <text x="820" y="566" class="edgelbl">adb shell input on one display id · screenrecord / screencap</text>

  <!-- ══════════════════════ layer 3 · android ══════════════════════ -->
  <rect x="80" y="588" width="1440" height="212" rx="18" class="layer"/>
  <text x="116" y="626" class="kicker">03 · ANDROID RUNTIME</text>
  <text x="116" y="652" class="body">One emulator, one Android user profile — but a separate virtual display per app, so windows never share a screen.</text>

  <g>
    <rect x="116" y="672" width="392" height="100" rx="12" class="chip"/>
    <text x="136" y="702" class="name">Android Emulator</text>
    <text x="136" y="724" class="sub">x86_64 system image · hardware accelerated</text>
    <text x="136" y="744" class="sub">started and stopped by WINAPK</text>

    <rect x="524" y="672" width="392" height="100" rx="12" class="chip"/>
    <text x="544" y="702" class="name">Display 0</text>
    <text x="544" y="724" class="sub">Android's own screen — the phone view</text>
    <text x="544" y="744" class="sub">captured and touched through adb</text>

    <rect x="932" y="672" width="552" height="100" rx="12" class="chip"/>
    <text x="952" y="702" class="name">Virtual displays 1…n</text>
    <text x="952" y="724" class="sub">one per running app, each mirrored into its own Windows window by scrcpy</text>
    <text x="952" y="744" class="sub">input is addressed to a display id, never to the wrong app</text>
  </g>

  <!-- footer note -->
  <text x="80" y="842" class="tag">SECURITY</text>
  <text x="176" y="842" class="body">The agent endpoint binds to loopback only, requires a per-session token, and refuses a browser Origin. Guest egress to the host's loopback is denied at boot and measured.</text>
</svg>
