[package]
name = "droidwin"
version = "0.1.0"
description = "DroidWin — run Android apps on Windows desktop windows"
edition = "2021"
rust-version = "1.80"
# Two binaries exist (the app and the runtime proof harness), so the app has to
# be named explicitly for `tauri build` and for a bare `cargo run`.
default-run = "droidwin"

[lib]
name = "droidwin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.5"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["process", "time", "io-util", "sync", "rt", "macros", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[[bin]]
name = "droidwin"
path = "src/main.rs"
